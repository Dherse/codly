name: Tests
on:
  push:
    # ensures this is not run for PRs too
    branches: [ main ]
  pull_request:
    # optional but a good default
    branches: [ main ]

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Typstyle
        uses: baptiste0928/cargo-install@v3.0.0
        with:
          crate: typstyle
          version: '0.15.1'

      - name: Check Typst formatting
        run: >-
          typstyle --check --line-width 100 --indent-width 2
          --no-reorder-import-items codly.typ src tests

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Probe runner package cache
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: cargo poppler-utils
          version: 1.0

      - name: Install Tytanic
        uses: baptiste0928/cargo-install@v3.0.0
        with:
          crate: tytanic
          version: '0.4.1'
      - name: Setup typst
        uses: typst-community/setup-typst@v4
        with:
          version: 'v0.15.1'
      - name: Run test suite
        run: python3 tests/run.py
      - name: Archive diffs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: |
            tests/**/diff/*.png
            tests/**/out/*.png
            tests/**/ref/*.png
          retention-days: 5
